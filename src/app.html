<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			document.documentElement.classList.add('js');
			const added = new WeakMap();
			new MutationObserver((list) => {
				for (const m of list)
					for (const n of m.addedNodes) {
						if (!(n instanceof Element)) continue;
						for (const img of n.matches('img') ? [n] : n.querySelectorAll('img')) {
							if (img.complete && img.naturalWidth) img.classList.add('now', 'in');
							else added.set(img, performance.now());
						}
					}
			}).observe(document.documentElement, { childList: true, subtree: true });
			for (const ev of ['load', 'error'])
				document.addEventListener(ev, (e) => {
					const img = e.target;
					if (!(img instanceof HTMLImageElement)) return;
					if (performance.now() - (added.get(img) ?? 0) < 100) img.classList.add('now');
					img.classList.add('in');
				}, true);
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
